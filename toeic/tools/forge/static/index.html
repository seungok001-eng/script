<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>토익 사진 공방</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --bg:#f6f1e8; --panel:#fffdf8; --line:#e0d6c4; --text:#2b2520; --dim:#8a7d6c; --accent:#e0862e; --ok:#4f9d5b; --warn:#d49a2a; --bad:#cf4f45; --info:#3f87c9; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:"Malgun Gothic","Segoe UI",sans-serif; font-size:14px; display:flex; height:100vh; overflow:hidden; }
aside { width:230px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
aside h1 { font-size:17px; margin:0; padding:14px 16px; border-bottom:1px solid var(--line); color:var(--accent); }
aside .nav { flex:1; overflow:auto; }
aside .item { padding:10px 16px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
aside .item:hover { background:#f3ecdf; }
aside .item.on { background:#fbe9d3; border-left:3px solid var(--accent); }
aside .item .cnt { color:var(--dim); font-size:12px; }
aside .foot { padding:10px 12px; border-top:1px solid var(--line); font-size:12px; color:var(--dim); }
aside .foot select { width:100%; margin-top:4px; }
main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.topbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line); font-size:13px; }
.topbar .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#aaa; margin-right:5px; }
.topbar .dot.on { background:var(--ok); }
#view { flex:1; overflow:auto; padding:14px 18px; }
button { background:#efe7d8; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:5px 11px; cursor:pointer; font-family:inherit; font-size:13px; }
button:hover { background:#e6dcc8; }
button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:bold; }
button.ok { background:#d9efdc; } button.bad { background:#f3d6d3; } button.small { padding:2px 8px; font-size:12px; }
button:disabled { opacity:.45; cursor:default; }
input, select, textarea { background:#fff; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:5px 7px; font-family:inherit; font-size:13px; }
textarea { width:100%; min-height:60px; resize:vertical; line-height:1.4; }
label { display:block; color:var(--dim); font-size:12px; margin:8px 0 3px; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.hint { color:var(--dim); font-size:12px; }
.toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.tabs { display:flex; gap:4px; flex-wrap:wrap; }
.tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:12px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
.card h3 { margin:0 0 6px; font-size:14px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.card.ref { border-color:var(--info); box-shadow:0 0 0 1px var(--info) inset; }
.chip { font-size:11px; padding:2px 8px; border-radius:10px; background:#ddd; color:#333; white-space:nowrap; }
.chip.pending { background:#eee; } .chip.queued { background:#cfe0f3; } .chip.generating { background:#b8d4f0; }
.chip.review { background:#f6e0a8; } .chip.approved { background:#cfe8d2; } .chip.failed { background:#f3c4c0; } .chip.auto { background:#f0d9a8; } .chip.applied { background:#bfe3c4; }
.thumb { background-image:linear-gradient(45deg,#e8e2d6 25%,transparent 25%),linear-gradient(-45deg,#e8e2d6 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e8e2d6 75%),linear-gradient(-45deg,transparent 75%,#e8e2d6 75%); background-size:16px 16px; background-position:0 0,0 8px,8px -8px,-8px 0; background-color:#f4f0e8; border-radius:5px; display:flex; align-items:center; justify-content:center; height:180px; overflow:hidden; cursor:zoom-in; }
.thumb img, .thumb video { max-height:176px; max-width:100%; }
.thumb.empty { cursor:default; color:var(--dim); font-size:12px; }
.rawimg { height:60px; border-radius:4px; opacity:.85; cursor:zoom-in; border:1px solid var(--line); }
.drop { border:2px dashed var(--line); border-radius:5px; padding:8px; text-align:center; color:var(--dim); cursor:pointer; font-size:12px; flex:1; }
.drop.on { border-color:var(--accent); color:var(--accent); background:#fbf0e2; }
.err { color:var(--bad); font-size:12px; }
.log { font-family:Consolas, monospace; font-size:11px; color:#444; white-space:pre-wrap; max-height:300px; overflow:auto; background:#f1ece2; padding:8px; border-radius:4px; }
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:5; }
.modal-bg.on { display:flex; }
.modal { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:18px 22px; width:640px; max-height:90vh; overflow:auto; }
.lb { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:20; flex-direction:column; }
.lb.on { display:flex; }
.lb img, .lb video { max-width:95vw; max-height:88vh; background:#fff; }
.lb .cap { color:#eee; padding:8px; font-size:13px; }
.toast { position:fixed; left:50%; top:14px; transform:translateX(-50%); background:#4f9d5b; color:#fff; padding:8px 16px; border-radius:6px; display:none; z-index:9; }
.toast.bad { background:#cf4f45; }
.stat { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; } .stat div { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 14px; min-width:120px; }
.stat b { font-size:20px; display:block; } .stat span { color:var(--dim); font-size:12px; }
table.prog { border-collapse:collapse; width:100%; font-size:13px; } table.prog td, table.prog th { padding:5px 8px; border-bottom:1px solid var(--line); text-align:left; }
.bar { display:flex; height:10px; background:#eee; border-radius:4px; overflow:hidden; width:200px; } .bar .ok { background:var(--ok); } .bar .rv { background:var(--warn); } .bar .q { background:var(--info); }
.cand { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:5px 0; border-top:1px dashed var(--line); font-size:12px; }
.cand audio { height:30px; width:220px; }
.cand .ck { color:var(--dim); } .cand .ck.warn { color:var(--bad); font-weight:bold; }
.cand.ap { background:#eef8ef; }
code { background:#f1ece2; padding:1px 5px; border-radius:3px; }
details summary { cursor:pointer; color:var(--dim); font-size:12px; }
.pcheck { font-size:12px; line-height:1.45; margin:4px 0 6px; } .pcheck .must { color:#2f7a3c; } .pcheck .mustnot { color:#b2443b; margin-top:2px; }
.pcheck .opts { margin-top:5px; padding-top:5px; border-top:1px dashed var(--line); color:#555; } .pcheck .ans { color:#2f7a3c; font-weight:bold; }
.thumb { height:225px !important; } .thumb img { max-height:221px !important; }
.notice { background:#eaf3fb; border:1px solid #c6ddf0; border-radius:6px; padding:8px 12px; margin-bottom:12px; font-size:13px; }
</style>
</head>
<body>
<aside>
  <h1>토익 사진 공방</h1>
  <div class="nav" id="nav"></div>
  <div class="foot">묶음 (30장씩)<select id="unitSel" onchange="setUnit(this.value)"><option value="all">전체</option></select></div>
</aside>
<main>
  <div class="topbar">
    <span><span class="dot" id="extDot"></span><span id="extText">확장: 연결 안 됨</span></span>
    <span>생성기 <select id="genSel" onchange="saveGen(this.value)"><option value="flow">플로우 (확장)</option><option value="gemini">제미나이 API</option></select></span>
    <button class="primary" onclick="autoAll(true)">남은 것 전부 자동 생성</button>
    <button class="ok" onclick="applyAll()">승인된 것 전부 앱에 넣기</button>
    <input type="checkbox" id="unattended" style="display:none">
    <span class="hint" id="usage"></span>
    <button class="small" onclick="openLog()">로그</button>
  </div>
  <div id="view"></div>
</main>

<div class="modal-bg" id="logModal" onclick="if (event.target === this) this.classList.remove('on')"><div class="modal">
  <h3 style="margin-top:0">최근 기록</h3><div class="log" id="logBody"></div>
  <div class="row" style="justify-content:flex-end; margin-top:10px"><button onclick="document.getElementById('logModal').classList.remove('on')">닫기</button></div>
</div></div>

<div class="modal-bg" id="genModal" onclick="if (event.target === this) this.classList.remove('on')"><div class="modal">
  <h3 style="margin-top:0" id="genTitle">후보 만들기</h3>
  <p class="hint" id="genHint"></p>
  <label>대본 (한 줄에 하나. 낱소리는 "/IPA/" 와 늘인 철자가 깨끗하다. 단어·대사·지시문에는 서버가 "Say slowly and clearly: " 를 앞에 붙인다)</label>
  <textarea id="genTexts" style="min-height:70px"></textarea>
  <label>목소리 (여러 개 고르면 대본 × 목소리 만큼 후보가 생긴다)</label>
  <div id="genVoices" class="row" style="gap:4px 12px; max-height:160px; overflow:auto"></div>
  <div id="genCutRow"><label style="margin:0"><input type="checkbox" id="genCut"> 단어 앞부분 잘라내기 후보도 만들기 (같은 글자 첫 단어 음성에서)</label></div>
  <div class="row" style="justify-content:flex-end; margin-top:12px"><button onclick="document.getElementById('genModal').classList.remove('on')">취소</button><button class="primary" onclick="submitGen()">만들기</button></div>
</div></div>

<div class="lb" id="lb" onclick="this.classList.remove('on')"><div id="lbBody"></div><div class="cap" id="lbCap"></div></div>
<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
