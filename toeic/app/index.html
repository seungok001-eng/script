<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>토익핏</title>
  <meta name="description" content="목표 점수에 맞춘 토익 영단어 3,600개 · 원어민 음성 · 간격 반복 복습 · Part 1~7 실전 문제 · 정규·하프 모의고사 · 예상 점수" />
  <meta name="theme-color" content="#2b59f0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="토익핏" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="preload" href="fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/app.css" />
  <script>
    // 첫 화면 깜빡임 방지: 저장된 테마를 먼저 적용
    try {
      var t = JSON.parse((localStorage.getItem("toeicfit.v1") || localStorage.getItem("vocafit.v1")) || "{}").settings;
      if (t && t.theme && t.theme !== "system") document.documentElement.setAttribute("data-theme", t.theme);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="toast-wrap" id="toast" role="status" aria-live="polite"></div>
  <noscript>이 앱을 사용하려면 자바스크립트를 켜 주세요.</noscript>
  <script src="js/l10n/langs.js"></script>
  <script>
    // 언어: 설정에서 고른 언어 → 없으면 기기 언어 → 번역이 있는 언어만. 한국어가 아니면 번역 파일을 먼저 읽는다
    (function () {
      var have = (window.TOEICFIT_LANGS || []).map(function (l) { return l.code; });
      var pick = "";
      try { var st = JSON.parse((localStorage.getItem("toeicfit.v1") || localStorage.getItem("vocafit.v1")) || "{}").settings; if (st && st.lang) pick = st.lang; } catch (e) {}
      if (!pick) {
        var n = String((navigator.languages && navigator.languages[0]) || navigator.language || "ko").toLowerCase();
        var map = [["ko", "ko"], ["ja", "ja"], ["vi", "vi"], ["zh", "zh-TW"], ["es", "es"], ["fr", "fr"], ["en", "en"]];
        pick = "en";
        for (var i = 0; i < map.length; i++) if (n.indexOf(map[i][0]) === 0) { pick = map[i][1]; break; }
      }
      if (have.indexOf(pick) < 0) pick = have.indexOf("en") >= 0 && pick !== "ko" ? "en" : "ko";
      window.TOEICFIT_LANG = pick;
      if (pick !== "ko") document.write('<script src="js/l10n/' + pick + '.js"><\/script>');
    })();
  </script>
  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
