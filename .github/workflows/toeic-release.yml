# 토익핏 — Google Play 출시용 서명된 AAB 빌드 (수동 실행)
# Actions → toeic-release-aab → Run workflow → 버전 이름(예: 1.0.1) 입력.
# 필요한 저장소 비밀값(Settings → Secrets and variables → Actions):
#   TOEICFIT_KEYSTORE_BASE64   업로드 키(.jks)를 base64 로 바꾼 글자
#   TOEICFIT_KEYSTORE_PASSWORD 키 저장소 비밀번호
#   TOEICFIT_KEY_ALIAS         키 별칭 (예: toeicfit)
#   TOEICFIT_KEY_PASSWORD      키 비밀번호
# 결과: 실행 화면 아래 Artifacts → toeicfit-release-aab (zip 안의 .aab 를 Play Console 에 올린다)
name: toeic-release-aab

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "버전 이름 (예: 1.0.0)"
        required: true
        default: "1.0.0"
      unsigned_check:
        description: "서명 없이 구성만 확인 (Play 에 올릴 수 없는 점검용 AAB)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: toeic
    steps:
      - uses: actions/checkout@v4

      - name: 서명 비밀값 확인
        if: ${{ !inputs.unsigned_check }}
        env:
          KS: ${{ secrets.TOEICFIT_KEYSTORE_BASE64 }}
          KP: ${{ secrets.TOEICFIT_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.TOEICFIT_KEY_ALIAS }}
          KK: ${{ secrets.TOEICFIT_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing TOEICFIT_KEYSTORE_BASE64"
          [ -n "$KP" ] || missing="$missing TOEICFIT_KEYSTORE_PASSWORD"
          [ -n "$KA" ] || missing="$missing TOEICFIT_KEY_ALIAS"
          [ -n "$KK" ] || missing="$missing TOEICFIT_KEY_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::저장소 비밀값이 없습니다:$missing (toeic/RELEASE.md 참고)"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 안드로이드 SDK 준비
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: 의존성 설치
        run: npm ci

      - name: 웹 파일을 안드로이드 프로젝트로 복사
        run: npx cap sync android

      # 음성(약 170MB)을 Play Asset Delivery 'install-time' 묶음으로 옮긴다 — 기본 모듈 200MB 제한.
      # 설치할 때 함께 내려받고 앱 안 경로(public/audio/…)는 그대로라 코드 변경이 없다
      - name: 음성을 설치 묶음(audio_pack)으로 분리
        run: |
          mkdir -p android/audio_pack/src/main/assets/public
          mv android/app/src/main/assets/public/audio android/audio_pack/src/main/assets/public/audio
          du -sh android/audio_pack/src/main/assets/public/audio android/app/src/main/assets/public

      - name: 서명된 AAB 빌드
        working-directory: toeic/android
        env:
          TOEICFIT_AUDIO_PACK: "1"
          KS_B64: ${{ secrets.TOEICFIT_KEYSTORE_BASE64 }}
          TOEICFIT_KEYSTORE_PASSWORD: ${{ secrets.TOEICFIT_KEYSTORE_PASSWORD }}
          TOEICFIT_KEY_ALIAS: ${{ secrets.TOEICFIT_KEY_ALIAS }}
          TOEICFIT_KEY_PASSWORD: ${{ secrets.TOEICFIT_KEY_PASSWORD }}
          TOEICFIT_VERSION_NAME: ${{ inputs.version_name }}
          TOEICFIT_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export TOEICFIT_KEYSTORE="$RUNNER_TEMP/upload.jks"
          fi
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: 파일 이름 정리 · 크기 확인
        run: |
          mkdir -p dist
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/toeicfit-${{ inputs.version_name }}-${{ github.run_number }}.aab"
          ls -la dist
          # Play 제한: 기본 모듈(앱) 압축 크기 200MB, install-time 묶음은 따로 (합계 4GB)
          python3 - <<'PY'
          import glob, zipfile
          z = zipfile.ZipFile(glob.glob("dist/*.aab")[0]); s = {}
          for i in z.infolist(): m = i.filename.split("/")[0]; s[m] = s.get(m, 0) + i.compress_size
          for m, v in sorted(s.items()): print(f"{m}: {v / 1048576:.1f} MB")
          base = s.get("base", 0)
          if base > 150 * 1048576: print(f"::warning::기본 모듈 {base / 1048576:.0f}MB — 200MB 제한에 가깝습니다")
          if "audio_pack" not in s: print("::error::음성 묶음(audio_pack)이 AAB 에 없습니다"); raise SystemExit(1)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: toeicfit-release-aab
          path: toeic/dist/*.aab
          retention-days: 7
